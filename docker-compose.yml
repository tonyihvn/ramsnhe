version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dqaplus-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SERVER_PORT: 3000
      FRONTEND_PORT: 9090
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: dqappdb
      DB_PORT: 5432
      FRONTEND_HOSTS: http://localhost:3000
      ALLOW_ALL_ORIGINS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dqaplus-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: dqaplus-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: dqappdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dqaplus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  dqaplus-network:
    driver: bridge
