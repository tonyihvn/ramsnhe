<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI Authentication Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            color: #333;
            margin: 0 0 10px;
            font-size: 24px;
        }
        p {
            color: #666;
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Completing Sign-In</h1>
        <p>Processing your authentication. Please wait...</p>
    </div>

    <script>
        // This page receives the OAuth response from Azure AD
        // and handles the callback by redirecting to the main app
        
        window.addEventListener('load', function() {
            // Extract the hash/query parameters containing the auth response
            const hash = window.location.hash;
            const search = window.location.search;
            
            // Redirect to the main app with the auth response
            if (hash || search) {
                // Redirect to the dashboard or main page with the auth response
                window.location.href = '/#/activities/dashboard' + hash + search;
            } else {
                // No auth response, redirect to main app
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
